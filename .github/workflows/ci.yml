name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs only for a tag push, and catches the one mistake that cannot be fixed
  # in place: Zig stamps build.zig.zon's declared version into the dependency
  # hash consumers record, so a tag that disagrees with it is visible in every
  # consumer's lockfile and takes another release to correct.
  release-metadata:
    name: Tag matches the declared version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: tools/check-version.sh "$GITHUB_REF_NAME"

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v6
      # Keep this in sync with build.zig.zon minimum_zig_version.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig version
      - run: make fmt-check
      # `make test` is the whole suite, PTY tests included. Both runners can
      # allocate a pty; where one cannot, those tests skip rather than fail.
      - run: make test
      - run: make verify

  portability:
    name: Cross-build, and prove Linux needs no libc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # The `none` ABI cannot link libc at all, so a successful build is proof
      # that no std.c call is reachable on the Linux path. Do not relax these
      # to -musl: that silently starts linking libc if anything adds -lc.
      - run: zig build -Dtarget=x86_64-linux-none
      - run: zig build -Dtarget=aarch64-linux-none
      # The ABIs consumers actually ship.
      - run: zig build -Dtarget=x86_64-linux-musl
      - run: zig build -Dtarget=aarch64-linux-musl
      - run: zig build -Dtarget=x86_64-linux-gnu
      - run: zig build -Dtarget=aarch64-macos
      - run: zig build -Dtarget=x86_64-macos

      # Building the libc-free binary proves it links; running it proves the
      # raw syscalls behave. The runner is x86_64 Linux, so it executes
      # natively. `script` gives it a pty, without which every terminal check
      # reports SKIP and the run proves much less.
      - name: Run the libc-free verifier on real Linux, under a pty
        run: |
          zig build verify -Dtarget=x86_64-linux-none -Doptimize=ReleaseSafe
          script -qec zig-out/bin/zooi-verify /dev/null
